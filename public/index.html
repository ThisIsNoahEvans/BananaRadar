<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Banana Radar — is the flavour in stock?</title>
    <meta
      name="description"
      content="Check live Starbucks menus to see if the Banana flavour is in stock near you."
    />
    <link rel="canonical" href="https://banana.itsnoahevans.co.uk/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Banana Radar" />
    <meta property="og:title" content="Banana Radar — is the flavour in stock?" />
    <meta
      property="og:description"
      content="Check live Starbucks menus to see if the Banana flavour is in stock near you."
    />
    <meta property="og:url" content="https://banana.itsnoahevans.co.uk/" />
    <meta property="og:image" content="https://banana.itsnoahevans.co.uk/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Banana Radar — has your local gone bananas?" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Banana Radar — is the flavour in stock?" />
    <meta
      name="twitter:description"
      content="Check live Starbucks menus to see if the Banana flavour is in stock near you."
    />
    <meta name="twitter:image" content="https://banana.itsnoahevans.co.uk/og.png" />
    <meta name="theme-color" content="#1e3932" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Banana Radar" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="bg-glow" aria-hidden="true"></div>
    <header class="top">
      <div class="brand">
        <span class="siren" aria-hidden="true"></span>
        Banana Radar
      </div>
      <div class="top-actions">
        <button type="button" id="install" class="btn ghost compact" hidden>
          Install app
        </button>
        <div class="top-meta">
          <div class="unit-toggle" role="group" aria-label="Distance unit">
            <button type="button" data-unit="km" aria-pressed="true">km</button>
            <button type="button" data-unit="mi" aria-pressed="false">mi</button>
          </div>
        </div>
      </div>
    </header>

    <main>
      <section class="hero">
        <div id="radar" class="radar" aria-hidden="true">
          <span class="ping"></span>
          <span class="ping delay"></span>
          <svg class="banana" viewBox="0 0 200 200" role="img" aria-label="Banana">
            <g transform="translate(-2 4)">
              <path
                d="M 132 46 L 148 25 L 158 32 L 142 53 Z"
                fill="#5a3b12"
                stroke="#5a3b12"
                stroke-width="2"
                stroke-linejoin="round"
              />
              <path
                d="M 50 140 C 130 180 180 130 140 50 C 120 90 90 120 50 140 Z"
                fill="#f6c343"
                stroke="#f6c343"
                stroke-width="6"
                stroke-linejoin="round"
              />
              <path
                d="M 62 133 C 110 155 155 110 133 62"
                fill="none"
                stroke="#e2a51a"
                stroke-width="4"
                stroke-linecap="round"
              />
              <circle cx="48" cy="142" r="3" fill="#3d2a14" />
            </g>
          </svg>
        </div>
        <h1>Has your local gone <em>bananas</em>?</h1>
        <p class="lede">
          Check if your local Starbucks has the Banana flavour in stock.
        </p>

        <div class="search-wrap">
          <form id="search-form" class="search">
            <label class="sr-only" for="place">Postcode or place</label>
            <input
              id="place"
              name="q"
              type="search"
              placeholder="Postcode or place"
              autocomplete="off"
            />
            <button type="submit" id="search-btn" class="btn secondary">Search</button>
            <button type="button" id="locate" class="btn primary">
              Use my location
            </button>
          </form>
          <div id="search-progress" class="search-progress" hidden>
            <span></span>
          </div>
        </div>
      </section>

      <section id="status" class="status" hidden aria-live="polite"></section>
      <section id="summary" class="summary" hidden aria-live="polite"></section>
      <section id="watches" class="watches" hidden>
        <div class="alert-card">
          <h3>Watching</h3>
          <p id="watch-hint">
            We'll ping this phone when banana flavour comes back at a store you
            watch.
          </p>
          <p id="watch-status" class="alert-status" hidden></p>
          <ul id="watch-list" class="watch-list"></ul>
        </div>
      </section>
      <section id="toolbar" class="toolbar" hidden>
        <label class="check">
          <input type="checkbox" id="open-only" checked />
          <span>Open only</span>
        </label>
        <p id="filter-note" class="filter-note"></p>
      </section>
      <section id="spotlight" class="spotlight" hidden></section>
      <section id="results" class="results" hidden></section>
    </main>

    <footer>
      <p>
        Stock comes from public Starbucks store menus. Not affiliated with Starbucks.
      </p>
    </footer>
    <script src="/app.js"></script>
  </body>
</html>
