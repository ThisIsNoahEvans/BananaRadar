<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Banana Radar">
  <defs>
    <radialGradient id="glowBanana" cx="18%" cy="8%" r="55%">
      <stop offset="0%" stop-color="#f6c343" stop-opacity="0.5"/>
      <stop offset="55%" stop-color="#f6c343" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGreen" cx="92%" cy="12%" r="48%">
      <stop offset="0%" stop-color="#00754a" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#00754a" stop-opacity="0"/>
    </radialGradient>
    <filter id="bananaShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#e09412" flood-opacity="0.38"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#fff6df"/>
  <rect width="1200" height="630" fill="url(#glowBanana)"/>
  <rect width="1200" height="630" fill="url(#glowGreen)"/>

  <g transform="translate(210,315)" fill="none" stroke="#00754a" stroke-opacity="0.22">
    <circle r="86" stroke-width="3"/>
    <circle r="132" stroke-width="3"/>
    <circle r="178" stroke-width="2.5"/>
    <circle r="224" stroke-width="2" stroke-opacity="0.16"/>
  </g>

  <g transform="translate(86, 204) scale(1.15)" filter="url(#bananaShadow)">
    <g transform="translate(-2 4)">
      <path
        d="M 136 50 L 148 30 L 158 36 L 144 55 Z"
        fill="#5a3b12"
        stroke="#5a3b12"
        stroke-width="3"
        stroke-linejoin="round"
      />
      <path
        d="M 50 140 C 130 180 180 130 140 50 C 120 90 90 120 50 140 Z"
        fill="#f6c343"
        stroke="#f6c343"
        stroke-width="16"
        stroke-linejoin="round"
      />
      <path
        d="M 65 130 C 110 150 150 110 130 65"
        fill="none"
        stroke="#e2a51a"
        stroke-width="5"
        stroke-linecap="round"
      />
      <circle cx="48" cy="142" r="5" fill="#3d2a14" />
    </g>
  </g>

  <g transform="translate(500,168)">
    <g transform="translate(0,8)">
      <circle cx="11" cy="11" r="11" fill="#1e3932"/>
      <circle cx="11" cy="11" r="7" fill="none" stroke="#f6c343" stroke-width="3"/>
    </g>
    <text x="34" y="18" fill="#1e3932" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="0.4">Banana Radar</text>
    <text x="34" y="46" fill="#5d6b57" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="500">Unofficial &#183; live store menus</text>
  </g>

  <text x="500" y="300" fill="#1c2416" font-family="Georgia, Times New Roman, serif" font-size="64" font-weight="700">Has your local</text>
  <text x="500" y="378" fill="#1c2416" font-family="Georgia, Times New Roman, serif" font-size="64" font-weight="700">gone <tspan fill="#00754a" font-style="italic">bananas</tspan>?</text>

  <text x="500" y="448" fill="#5d6b57" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="500">Check if the Banana flavour is in stock nearby.</text>
</svg>
